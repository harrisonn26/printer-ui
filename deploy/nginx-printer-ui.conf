# printer-ui, served alongside the existing Fluidd install.
#
# Mirrors /etc/nginx/sites-available/fluidd, on port 4411 with its own root.
# Not 8080: conf.d/upstreams.conf reserves 127.0.0.1:8080 for mjpgstreamer1,
# so binding it here would break a webcam added later. 4408 is Fluidd,
# 4409 is Mainsail by convention, 4410 is the old fluidd-lite.
# The proxy blocks matter: OrcaSlicer uploads through the OctoPrint-compatible
# API on the same host it renders the Device UI from, so without them
# /api/version hits the SPA fallback, returns HTML, and Orca reports
# "Could not parse server response".

server {
    listen 4411;
    # uncomment the next line to activate IPv6
    # listen [::]:4411;

    access_log /var/log/nginx/printer-ui-access.log;
    error_log /var/log/nginx/printer-ui-error.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css text/javascript application/javascript application/json;

    root /home/harrison/printer-ui/dist;
    index index.html;
    server_name _;

    # Uploads are whole gcode files: no size cap, no request buffering.
    client_max_body_size 0;
    proxy_request_buffering off;

    # Single-page app: fall back to index.html for any route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate the entry point so a redeploy is picked up.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Never cache config.json so Moonraker URL changes apply immediately.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # Hash-named Vite assets are safe to cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Moonraker's websocket, same-origin.
    location /websocket {
        proxy_pass http://apiserver/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Moonraker's REST API, including the OctoPrint compatibility layer that
    # OrcaSlicer uploads through. A regex location outranks the SPA fallback.
    location ~ ^/(printer|api|access|machine|server)/ {
        proxy_pass http://apiserver$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
    }
}
