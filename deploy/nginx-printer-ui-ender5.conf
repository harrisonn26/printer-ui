# printer-ui for the Ender 5, whose Moonraker (moonraker-ender5) listens on
# 7126. Same app and files as nginx-printer-ui.conf, on port 4412, with
# Moonraker and the OctoPrint-compatible upload API proxied to 7126 instead
# of 7125 — so Orca's Ender 5 profile (print_host :4412) uploads to, and its
# Device tab opens on, the Ender 5 rather than the other printer.

upstream ender5_api {
    ip_hash;
    server 127.0.0.1:7126;
}

server {
    listen 4412;
    # uncomment the next line to activate IPv6
    # listen [::]:4412;

    access_log /var/log/nginx/printer-ui-ender5-access.log;
    error_log /var/log/nginx/printer-ui-ender5-error.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css text/javascript application/javascript application/json;

    root /home/harrison/printer-ui/dist;
    index index.html;
    server_name _;

    # Uploads are whole gcode files: no size cap, no request buffering.
    client_max_body_size 0;
    proxy_request_buffering off;

    # Single-page app: fall back to index.html for any route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate the entry point so a redeploy is picked up.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Never cache config.json so Moonraker URL changes apply immediately.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # Hash-named Vite assets are safe to cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Moonraker's websocket, same-origin.
    location /websocket {
        proxy_pass http://ender5_api/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Moonraker's REST API, including the OctoPrint compatibility layer that
    # OrcaSlicer uploads through. A regex location outranks the SPA fallback.
    location ~ ^/(printer|api|access|machine|server)/ {
        proxy_pass http://ender5_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
    }
}
